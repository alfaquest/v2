# GitHub hosted runners sometimes fail to start with:
#   "The job was not acquired by Runner of type hosted even after multiple attempts"
# That is a transient platform error, not a test failure. Re-run once automatically.
name: Retry failed regression run

on:
  workflow_run:
    workflows: [Regression tests]
    types: [completed]

jobs:
  retry-on-runner-failure:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.name == 'Regression tests'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run failed workflow once
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            core.info(`Re-running workflow ${runId} after runner acquisition failure`);
            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
