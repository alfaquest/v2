# Deploy static site to Cloudflare Pages (alfaword.games / alfaquest-pages).
# Does not run tests — use when CI runners fail or you need a fast production push.
name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Require Cloudflare secrets
        run: |
          missing=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error title=Missing CLOUDFLARE_API_TOKEN::Create a Cloudflare API token with Cloudflare Pages → Edit, then add it under GitHub → Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error title=Missing CLOUDFLARE_ACCOUNT_ID::Add your Cloudflare account ID (see README) under GitHub → Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy public --project-name=alfaquest-pages --branch=main --commit-hash=${{ github.sha }}
